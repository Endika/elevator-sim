name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Deliberately false, unlike the other repos: cancelling an in-flight Pages deploy is how
  # the deploy queue gets jammed. Let each run finish.
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Pages must already be enabled with build_type=workflow. The `enablement: true` input
      # cannot do it: GITHUB_TOKEN gets "Resource not accessible by integration" when creating
      # the site. One-off, with a user token:
      #   gh api -X POST repos/Endika/elevator-sim/pages -f build_type=workflow
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v5
